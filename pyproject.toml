[project]
name = "vagus"
version = "0.1.0"
description = "VAGUS: Autonomous MAPE-K Intelligent Resource & QoS Manager for Linux Servers"
authors = [{ name = "Shree Nipane", email = "shreenipane@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["numpy", "pandas", "scikit-learn", "statsmodels", "torch", "matplotlib"]

[project.scripts]
vagus = "irm.cli:main"
irm = "irm.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs real cgroup writes, systemd-run, root, or network; run by the architect"]
